name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Several tests read the search model's vocabulary, which is downloaded rather than committed.
      - name: Fetch the search model
        run: npm run fetch:model

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
